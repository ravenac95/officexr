name: Build wasm packages
description: Builds @officexr/sim-wasm and @officexr/render-wasm (packages/*/pkg) from crates/officexr-sim-wasm and crates/officexr-render-web. Run after pnpm install.

inputs:
  render:
    description: Also build @officexr/render-wasm (the Bevy renderer). Its LTO build is slow, so its pkg is cached on the Rust sources.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install linker
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld

    - name: Install toolchain
      shell: bash
      run: rustup toolchain install

    - uses: Swatinem/rust-cache@v2
      with:
        key: wasm

    - name: Install wasm-pack
      shell: bash
      # Keep in step with WASM_PACK_VERSION and WASM_PACK_SHA256 in the Dockerfile.
      env:
        WASM_PACK_VERSION: 0.15.1
        WASM_PACK_SHA256: 410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2
      run: |
        name="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
        curl -sSfL -o "$RUNNER_TEMP/wasm-pack.tgz" "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/$name.tar.gz"
        echo "$WASM_PACK_SHA256  $RUNNER_TEMP/wasm-pack.tgz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/wasm-pack.tgz" --strip-components=1 -C "$HOME/.cargo/bin" "$name/wasm-pack"

    - name: Build sim-wasm
      shell: bash
      run: pnpm --filter @officexr/sim-wasm build

    - name: Restore render-wasm
      id: render-cache
      if: inputs.render == 'true'
      uses: actions/cache@v4
      with:
        path: packages/render-wasm/pkg
        key: render-wasm-${{ hashFiles('crates/**', 'Cargo.lock', 'rust-toolchain.toml') }}

    - name: Build render-wasm
      if: inputs.render == 'true' && steps.render-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter @officexr/render-wasm build

    - name: Check wasm sizes
      shell: bash
      # Cloudflare Pages rejects any file over 25 MiB.
      run: |
        limit=$((25 * 1024 * 1024))
        status=0
        for f in packages/*/pkg/*.wasm; do
          size=$(stat -c %s "$f")
          echo "$f: $size bytes"
          if [ "$size" -gt "$limit" ]; then
            echo "::error file=$f::$size bytes exceeds the 25 MiB Cloudflare Pages limit"
            status=1
          fi
        done
        exit $status
