name: Pages cleanup

# Deletes a closed PR's Pages preview deployments (branch `pr-<number>`, see
# pages-deploy.yml), so its alias and per-push URLs stop serving. The render
# wasm on R2 is content-addressed and shared across builds, so it stays.
on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Delete the PR's preview deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          BRANCH: pr-${{ github.event.pull_request.number }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$PROJECT" ]; then
            echo "::notice::Skipping the Pages cleanup: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_PAGES_PROJECT is not set."
            exit 0
          fi
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          # Collect every id first: deleting while paging would shift the pages.
          ids=""
          page=1
          while :; do
            body=$(curl -fsS -H "$auth" "$api?env=preview&per_page=25&page=$page")
            batch=$(jq -r --arg b "$BRANCH" '.result[] | select(.deployment_trigger.metadata.branch == $b) | .id' <<<"$body")
            ids="$ids $batch"
            [ "$(jq '.result | length' <<<"$body")" -lt 25 ] && break
            page=$((page + 1))
          done
          count=0
          for id in $ids; do
            # force: the branch's latest deployment backs its alias and is otherwise undeletable.
            curl -fsS -X DELETE -H "$auth" "$api/$id?force=true" >/dev/null
            count=$((count + 1))
          done
          echo "Deleted $count deployment(s) for $BRANCH"
