name: Bevy + Flutter prototype

# Builds mobile-flutter/ (a Flutter app that renders a Bevy scene behind Flutter widgets) for
# Android (APKs, on Linux) and iOS (an unsigned .ipa, on macOS), smoke-tests each on an
# emulator/simulator, and publishes them as the rolling `bevy-flutter-prototype` pre-release.

on:
  push:
    paths:
      - mobile-flutter/**
      - .github/workflows/mobile-flutter.yml
  workflow_dispatch:

concurrency:
  group: mobile-flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.50.0
  NDK_VERSION: 28.2.13676358

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install the Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      - name: Install Rust with the Android targets
        # rustup reads the pinned toolchain from the repo's rust-toolchain.toml.
        run: rustup toolchain install && rustup target add aarch64-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile-flutter/native

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build the Bevy library
        # ANDROID_HOME is the runner's shell env, not the workflow `env` context.
        run: >
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          mobile-flutter/scripts/build-native.sh arm64-v8a x86_64

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Analyze
        working-directory: mobile-flutter/app
        run: flutter pub get && flutter analyze

      - name: Build the APKs
        working-directory: mobile-flutter/app
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64

      - uses: actions/upload-artifact@v4
        with:
          name: bevy-flutter-apks
          path: mobile-flutter/app/build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 14

  emulator-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bevy-flutter-apks
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: mobile-flutter/scripts/emulator-smoke.sh apks/app-x86_64-release.apk smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke
          path: smoke/
          retention-days: 14

  ios:
    # Free on public repos like the Linux jobs; macOS is only needed because Flutter's iOS build
    # (and Apple's SDK) only run there.
    runs-on: macos-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with the iOS targets
        # rustup reads the pinned toolchain from the repo's rust-toolchain.toml.
        run: rustup toolchain install && rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile-flutter/native

      - name: Build the Bevy library
        run: mobile-flutter/scripts/build-ios-native.sh

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build the unsigned app
        working-directory: mobile-flutter/app
        run: flutter build ios --release --no-codesign

      - name: Package the .ipa
        run: >
          mobile-flutter/scripts/package-ipa.sh
          mobile-flutter/app/build/ios/iphoneos/Runner.app bevy-flutter-ios-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: bevy-flutter-ipa
          path: bevy-flutter-ios-unsigned.ipa
          retention-days: 14

      - name: Build for the simulator
        working-directory: mobile-flutter/app
        run: flutter build ios --simulator --debug

      - name: Launch on a simulator
        run: >
          mobile-flutter/scripts/ios-simulator-smoke.sh
          mobile-flutter/app/build/ios/iphonesimulator/Runner.app ios-smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-smoke
          path: ios-smoke/
          retention-days: 14

  publish:
    # Publishes even if a smoke test fails (an emulator's software GPU is not a phone's, and the
    # build is still worth trying on a device), and without the .ipa if the iOS build failed.
    needs: [build, ios]
    if: >
      always() && needs.build.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bevy-flutter-apks
          path: apks

      - uses: actions/download-artifact@v4
        # Missing only if the iOS build itself failed; a failed simulator test still uploads it.
        continue-on-error: true
        with:
          name: bevy-flutter-ipa
          path: apks

      - name: Replace the rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: bevy-flutter-prototype
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" apks/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Bevy + Flutter prototype" \
            --notes "Built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}. Android: install \`app-arm64-v8a-release.apk\` (allow installs from unknown sources); \`app-x86_64-release.apk\` is for emulators. iOS: sideload \`bevy-flutter-ios-unsigned.ipa\` with Sideloadly and your Apple ID. See mobile-flutter/README.md."
