name: Bevy + Flutter prototype

# Builds the Android APK in mobile-flutter/ (a Flutter app that renders a Bevy scene into a
# Flutter texture), smoke-tests it on an emulator, and publishes it as the rolling
# `bevy-flutter-prototype` pre-release.

on:
  push:
    paths:
      - mobile-flutter/**
      - .github/workflows/mobile-flutter.yml
  workflow_dispatch:

concurrency:
  group: mobile-flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.50.0
  NDK_VERSION: 28.2.13676358

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install the Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      - name: Install Rust with the Android targets
        # rustup reads the pinned toolchain from the repo's rust-toolchain.toml.
        run: rustup toolchain install && rustup target add aarch64-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile-flutter/native

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build the Bevy library
        # ANDROID_HOME is the runner's shell env, not the workflow `env` context.
        run: >
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          mobile-flutter/scripts/build-native.sh arm64-v8a x86_64

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Analyze
        working-directory: mobile-flutter/app
        run: flutter pub get && flutter analyze

      - name: Build the APKs
        working-directory: mobile-flutter/app
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64

      - uses: actions/upload-artifact@v4
        with:
          name: bevy-flutter-apks
          path: mobile-flutter/app/build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 14

  emulator-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bevy-flutter-apks
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: mobile-flutter/scripts/emulator-smoke.sh apks/app-x86_64-release.apk smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke
          path: smoke/
          retention-days: 14

  publish:
    # Publishes even if the emulator smoke test fails: the emulator's software GPU is not a
    # phone's, and the APK is still worth trying on a device.
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bevy-flutter-apks
          path: apks

      - name: Replace the rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: bevy-flutter-prototype
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" apks/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Bevy + Flutter prototype" \
            --notes "Built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}. Install \`app-arm64-v8a-release.apk\` on a phone (allow installs from unknown sources); \`app-x86_64-release.apk\` is for emulators. See mobile-flutter/README.md."
