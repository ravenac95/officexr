name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # Playwright 1.60 can't install chromium's deps on ubuntu-latest (26.04); move back once a
    # Playwright release supports it.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/build-wasm

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Bake layouts used by e2e
        # Baked layout GLBs are gitignored build outputs, but the default and
        # long_corridor maps load them; without a bake the world fails to load
        # (404 on /api/baked-layouts/<name>). Only layouts whose models ship in
        # the repo can bake here (the KayKit prototype pack isn't downloaded).
        run: pnpm --filter @officexr/world bake:layout platform long_corridor

      - name: E2E (editor interaction, hermetic)
        # Scoped to the specs that run hermetically: ?test=1 (in-memory
        # storage, bundled catalog — no database), or the dev server's
        # per-run scratch data dir (OFFICEXR_STUDIO_DATA_DIR, seeded by the
        # dev server), which every dev-server spec uses. The broader Playwright suite has
        # pre-existing rot (stale /api/cube-kinds endpoint, drifted
        # room-editor selectors) and is fixed/expanded in a follow-up;
        # see packages/studio/src/test-harness/README.md.
        run: pnpm test:e2e:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The visual tests' scenario maps use the prototype pack's models.
      - name: Install asset packs
        run: pnpm asset-packs:install

      # Mesa lavapipe renders the visual tests without a GPU; ffmpeg encodes their videos.
      - name: Install linker, lavapipe and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld mesa-vulkan-drivers ffmpeg

      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Upload visual test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-tests
          path: target/tmp/visual-tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build client (Linux)
        run: cargo build -p officexr-client

  ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup toolchain install && rustup target add aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      - name: Clippy for the iOS simulator
        run: cargo clippy --target aarch64-apple-ios-sim -p officexr-client -- -D warnings

      # ponytail: unsigned simulator build only; device signing and TestFlight are manual.
      - name: Build for the iOS simulator
        working-directory: crates/officexr-client/ios
        # The shared target dir lets rust-cache and clippy's build reuse the Xcode build's work.
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: >
          xcodebuild -project OfficeXR.xcodeproj -target OfficeXR -configuration Debug
          -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO build
