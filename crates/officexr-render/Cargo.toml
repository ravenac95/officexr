[package]
name = "officexr-render"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = [
  "std",
  "async_executor",
  "bevy_log",
  "bevy_asset",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_pbr",
  "bevy_gltf",
  "gltf_animation",
  "bevy_animation",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_text",
  "default_font",
  "png",
  "http",
  "https",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
meshopt-rs = "0.1.2"
percent-encoding = "2"
officexr-sim = { path = "../officexr-sim", optional = true }

# The browser has no worker-backed task pool. Native builds get `multi_threaded`
# through Cargo feature unification with the bevy dependency above.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["multi_threaded"] }

[features]
# The `render` binary settles the mugshot character with the sim.
mugshot = ["dep:officexr-sim"]
# The scenario harness in `tests/visual/`; needs a GPU or Mesa lavapipe.
visual-tests = ["mugshot"]

[[bin]]
name = "render"
required-features = ["mugshot"]

[[test]]
name = "visual"
path = "tests/visual/main.rs"
harness = false
required-features = ["visual-tests"]

[dev-dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["bevy_winit", "x11"] }
