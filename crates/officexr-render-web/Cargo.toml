[package]
name = "officexr-render-web"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Wasm-only so native workspace builds never unify `webgl2` into officexr-render's Bevy.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["bevy_winit", "web", "webgl2"] }
officexr-render = { path = "../officexr-render", features = ["mugshot"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
serde_json = "1"
wasm-bindgen = "=0.2.130"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
