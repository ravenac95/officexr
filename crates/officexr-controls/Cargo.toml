[package]
name = "officexr-controls"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["std", "bevy_window"] }
officexr-render = { path = "../officexr-render" }
officexr-sim = { path = "../officexr-sim" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
