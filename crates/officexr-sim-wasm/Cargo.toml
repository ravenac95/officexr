[package]
name = "officexr-sim-wasm"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
officexr-sim = { path = "../officexr-sim" }
serde = "1"
serde-wasm-bindgen = "=0.6.5"
wasm-bindgen = "=0.2.130"

# ponytail: no wasm-opt pass (its binaryen download is one more network fetch); the module ships ~1.5 MB unoptimized.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
