name: bevy_flutter
description: "Prototype: a Bevy 3D scene rendered inside a Flutter app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  # The iOS platform view and channels; Android's live in android/app (BevyTexture.kt).
  bevy_host:
    path: ../bevy_host

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
