name: bevy_host
description: "iOS side of the Bevy + Flutter prototype: a Metal-backed platform view that Bevy renders into."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.14.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: BevyHostPlugin
